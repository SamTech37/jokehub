name: "Weekly npm audit fix and lockfile update"

on:
  schedule:
    - cron: '0 3 * * 1' # weekly, Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Run npm audit fix (safe upgrades)
        run: npm audit fix || true

      - name: Create pull request for dependency changes
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): weekly npm audit fix"
          branch: "chore/weekly-npm-audit-fix"
          delete-branch: true
          title: "chore(deps): weekly npm audit fix"
          body: |
            Automated weekly npm audit remediation.
            - Runs `npm audit fix` with non-breaking updates
            - Updates lockfile and package metadata as needed
          labels: |
            dependencies
            security
