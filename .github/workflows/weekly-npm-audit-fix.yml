name: "Weekly npm audit fix and lockfile update"

on:
  schedule:
    - cron: '0 3 * * 1' # weekly, Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Run npm audit fix (may update package-lock.json)
        # --force chosen to aggressively fix vulnerabilities (may bump major versions)
        run: npm audit fix --force || true

      - name: Commit & push lockfile if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json package.json || true
            git commit -m "chore(deps): npm audit fix (automated)" || true
            git push
          else
            echo "No changes to commit"
          fi
